name: Daily PR digest

# Mails a short Thai note every morning ONLY when something actually happened:
# a pull request merged, the Thai catalogs landed on main, a new comment, a state change.
# On a quiet day it sends nothing at all (no "nothing new" mail).
#
# Runs on GitHub's servers, so the recipient's computer can stay off.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SMTP_USER  the Gmail address that sends (rachatasawasdikit@gmail.com)
#   SMTP_PASS  that account's Google App Password
# MAIL_TO is fixed below: rachatasawasdikit@gmail.com

on:
  schedule:
    # 23:30 UTC = 06:30 in Bangkok (UTC+7), every day
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yesterday's state (best effort)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: daily-digest.yml
          name: pr-state
          path: prev
          if_no_artifact_found: ignore

      - name: Notice what changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/storytold/craft-i18n"
          auth=(-H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" -H "User-Agent: daily-digest")

          echo '[]' > state.json
          for n in 340 341 342 213 180; do
            if json=$(curl -fsS "${auth[@]}" "$api/pulls/$n"); then
              printf '%s' "$json" | jq -c --argjson n "$n" \
                '{n:$n, state:.state, merged:(.merged // false), mergeable:.mergeable,
                  comments:.comments, title:.title, author:.user.login}' > one.json
              jq -s 'add' state.json one.json > tmp.json && mv tmp.json state.json
            fi
          done

          # the catalogs, and the exact commit they would arrive in
          echo '{}' > files.json
          for f in locales/th/wordcraft.tsv locales/th/craft-launcher.tsv; do
            body=$(curl -fsS "${auth[@]}" "$api/contents/$f" 2>/dev/null || echo '{}')
            printf '%s' "$body" | jq --arg f "$f" '{"\($f)": (.sha // "absent")}' > f1.json
            jq -s 'add' files.json f1.json > f2.json && mv f2.json files.json
          done

          prev_state='prev/state.json'
          prev_files='prev/files.json'
          [ -f "$prev_state" ] || echo '[]' > prev_state.fallback
          [ -f "$prev_files" ] || echo '{}' > prev_files.fallback
          [ -f "$prev_state" ] || prev_state='prev_state.fallback'
          [ -f "$prev_files" ] || prev_files='prev_files.fallback'

          # ---- the only two kinds of news we mail about --------------------------------
          : > news.txt
          add() { echo "  • $*" >> news.txt; }

          # 1) the Thai catalogs are on main (and this is new)
          for f in locales/th/wordcraft.tsv locales/th/craft-launcher.tsv; do
            now=$(jq -r --arg f "$f" '.[$f] // "absent"' files.json)
            was=$(jq -r --arg f "$f" '.[$f] // "absent"' "$prev_files")
            if [ "$now" != "absent" ] && [ "$was" = "absent" ]; then
              add "🎉 **${f#locales/th/} ถูกนำไปใช้แล้ว** — อยู่บน main ของ storytold/craft-i18n"
            fi
          done

          # 2) a pull request went from open to merged
          jq -r --slurpfile prev "$prev_state" '
            .[] | . as $x
            | ($prev[0] | map(select(.n == $x.n)) | .[0]) as $o
            | select($x.merged and ($o != null) and ($o.merged | not))
            | "🎉 **#\($x.n) ถูก merge แล้ว** — \($x.title)"' state.json | while read -r l; do add "$l"; done

          # 3) a closed pull request was reopened
          jq -r --slurpfile prev "$prev_state" '
            .[] | . as $x
            | ($prev[0] | map(select(.n == $x.n)) | .[0]) as $o
            | select($o != null and $o.state == "closed" and $x.state == "open")
            | "🔄 #\($x.n) ถูกเปิดใหม่ — \($x.title)"' state.json | while read -r l; do add "$l"; done

          # 4) new comments (count went up)
          jq -r --slurpfile prev "$prev_state" '
            .[] | . as $x
            | ($prev[0] | map(select(.n == $x.n)) | .[0]) as $o
            | select($o != null and $x.comments > $o.comments)
            | "💬 #\($x.n) มีคอมเมนต์ใหม่ \($x.comments - $o.comments) รายการ (รวม \($x.comments))"' \
            state.json | while read -r l; do add "$l"; done

          # 5) a PR that did not exist yesterday
          jq -r --slurpfile prev "$prev_state" '
            .[] | . as $x
            | select(($prev[0] | map(select(.n == $x.n))) | length == 0)
            | "🆕 #\($x.n) เพิ่งเปิด — \($x.title)"' state.json | while read -r l; do add "$l"; done

          # 6) what the newest comments actually say (only when there is news)
          : > quotes.txt
          if [ -s news.txt ]; then
            for n in 340 213; do
              curl -fsS "${auth[@]}" "$api/issues/$n/comments?per_page=1&direction=desc" 2>/dev/null \
                | jq -r --arg n "$n" '.[] | "── #\($n) · \(.user.login) · \(.created_at[0:16] | sub("T"; " "))\n\(.body | split("\n") | map(select((length > 0) and (startswith("<!--") | not) and (startswith(">") | not))) | .[0:4] | join("\n"))"' \
                >> quotes.txt || true
            done
          fi
          echo "news lines: $(grep -c '^  •' news.txt || true)"

      - name: Mail it only when there is something
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: rachatasawasdikit@gmail.com
        run: |
          set -euo pipefail
          if [ ! -s news.txt ]; then
            echo "ไม่มีอะไรเกิดขึ้น — ไม่ส่งเมล"
            exit 0
          fi

          today=$(TZ=Asia/Bangkok date '+%Y-%m-%d')
          n=$(grep -c '^  •' news.txt || true)

          {
            echo "From: $SMTP_USER"
            echo "To: $MAIL_TO"
            echo "Subject: [craft-i18n TH] $today — มีอะไรเกิดขึ้น $n เรื่อง"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo
            echo "มีความเคลื่อนไหวเกี่ยวกับงานภาษาไทย craft-i18n"
            echo
            cat news.txt
            echo
            if [ -s quotes.txt ]; then
              echo "─────────────────────"
              echo "คอมเมนต์ล่าสุด"
              echo "─────────────────────"
              cat quotes.txt
              echo
            fi
            echo "─────────────────────"
            echo "PR หลัก: https://github.com/storytold/craft-i18n/pull/340"
            echo "PR คู่แข่ง: https://github.com/storytold/craft-i18n/pull/213"
            echo
            echo "ถ้าวันไหนไม่มีอะไรเกิดขึ้น จะไม่มีเมลนี้"
          } > mail.txt

          cat mail.txt
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage

          head, _, body = open("mail.txt", encoding="utf-8").read().partition("\n\n")
          subject = [l for l in head.splitlines() if l.startswith("Subject: ")][0][9:]
          msg = EmailMessage()
          msg["Subject"] = subject
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(body)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
              s.send_message(msg)
          print("mail sent:", subject)
          PY

      - name: Keep today's state for tomorrow
        uses: actions/upload-artifact@v4
        with:
          name: pr-state
          path: |
            state.json
            files.json
          retention-days: 30

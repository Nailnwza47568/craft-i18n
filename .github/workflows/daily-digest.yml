name: Daily PR digest

# Mails a summary of the Thai pull requests every morning from GitHub's servers,
# so the recipient's computer does not need to be on.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DIGEST_TOKEN  a token that may read pull requests (scope: repo). Optional:
#                 without it the GITHUB_TOKEN below reads the public data instead.
#   SMTP_USER     the Gmail address that sends (rachatasawasdikit@gmail.com)
#   SMTP_PASS     that account's Google App Password
# MAIL_TO is fixed in this file: rachatasawasdikit@gmail.com
#
# The job only reads pull requests and sends one mail; it never writes to the repository.

on:
  schedule:
    # 23:30 UTC = 06:30 in Bangkok (UTC+7), every day
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect pull request state
        env:
          TOKEN: ${{ secrets.DIGEST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/storytold/craft-i18n"
          auth=(-H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" -H "User-Agent: daily-digest")

          : > prs.txt
          for n in 340 341 342 213; do
            if ! json=$(curl -fsS "${auth[@]}" "$api/pulls/$n"); then
              echo "#$n | could not be read (private data needs DIGEST_TOKEN)" >> prs.txt
              continue
            fi
            printf '%s' "$json" | jq -r '"#\(.number) | \(.state) | merged=\(.merged) | mergeable=\(.mergeable) | by \(.user.login) | comments=\(.comments) | updated \(.updated_at)\n    \(.title)"' >> prs.txt
          done

          for f in locales/th/wordcraft.tsv locales/th/craft-launcher.tsv; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${auth[@]}" "$api/contents/$f")
            if [ "$code" = "200" ]; then
              echo "$f is ON main" >> prs.txt
            else
              echo "$f is not on main yet (HTTP $code)" >> prs.txt
            fi
          done

          echo "--- unread notifications ---" >> prs.txt
          curl -fsS "${auth[@]}" "https://api.github.com/notifications" \
            | jq -r '.[] | "[\(.reason)] \(.subject.title)"' >> prs.txt 2>/dev/null || echo "(none readable)" >> prs.txt

      - name: Send the mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: rachatasawasdikit@gmail.com
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "SMTP_USER / SMTP_PASS are not set — add them as repository secrets." >&2
            exit 1
          fi
          if [ -n "${SMTP_USER}" ] && [ "${SMTP_USER}" != "${MAIL_TO}" ]; then
            echo "Note: SMTP_USER (${SMTP_USER}) differs from MAIL_TO (${MAIL_TO}); mail still goes to MAIL_TO."
          fi
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage

          state = open("prs.txt", encoding="utf-8").read()
          msg = EmailMessage()
          msg["Subject"] = "craft-i18n Thai PRs — daily digest"
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(
              "Thai localization status\n\n"
              + state
              + "\n\nLinks:\n"
              + "  https://github.com/storytold/craft-i18n/pull/340\n"
              + "  https://github.com/storytold/craft-i18n/pull/213\n"
              + "\nSent by .github/workflows/daily-digest.yml\n"
          )
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ssl.create_default_context()) as s:
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
              s.send_message(msg)
          print("mail sent to", os.environ["MAIL_TO"])
          PY
